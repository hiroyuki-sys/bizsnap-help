<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizSnap Help Center / ヘルプセンター</title>
    <script>
        // ユーザーのブラウザ言語を判定して自動リダイレクト
        (function() {
            var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (lang.indexOf('en') === 0) {
                window.location.replace('eng.html');
            } else {
                window.location.replace('jpn.html');
            }
        })();
    </script>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-sub: #6C6C70;
            --border-color: #E5E5EA;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        .icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #E5F1FF;
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: #D0E4FF;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📷</div>
        <h1>BizSnap Help Center</h1>
        <p>
            自動的に適切な言語のページへ移動しています...<br>
            <span style="font-size: 13px; color: #8E8E93;">Redirecting to the help page for your language...</span>
        </p>

        <div class="btn-group">
            <a href="jpn.html" class="btn btn-primary">
                🇯🇵 日本語版マニュアルを開く
            </a>
            <a href="eng.html" class="btn btn-secondary">
                🇺🇸 Open English User Guide
            </a>
        </div>
    </div>

</body>
</html>
